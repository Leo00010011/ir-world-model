# Train one DINO-DETR head (det_rgb or det_ir) on features encoded on the fly by the frozen
# DINOv2-Reg + PCA encoder (spec/2026-10-26-detector-training-pipeline, FR7-FR8):
#   bash slurm/submit.sh ctcomp3 projects/detection/train.py experiment=det_rgb cluster.timeout_min=1200 ...
# Recipe = detrex's DINO-ViTDet 50ep (third_party/detrex @ e244e6c), with deviations E1-E6 of plan.md:
#   E1 backbone_lr_factor 1.0 (detrex 0.1): our "backbone" is the new FeatureStem + pyramid, not a pretrained ViT
#   E2 16-mixed (detrex fp32, common/train.py:11 amp.enabled=False)
#   E3 horizontal flip only at a fixed 448x560 input (detrex: flip + multi-scale resize + crop)
#   E4 no MAE init_checkpoint (dino_vitdet_base_4scale_50ep.py:15): there is no ViT
#   E5 epoch-interval MultiStepLR, equivalent to detrex's zero-warmup per-iteration schedule
#   E6 validation every 5 epochs + best-val/AP selection (detrex: eval_period 5000 iters, 12ep.py:19)
defaults:
  - irwm_base
  - experiment: ???        # det_rgb | det_ir: the run must state which detector it trains
  - _self_

hydra:
  searchpath:
    - pkg://irwm.conf

project: detection

data:
  batch_size: 16           # = detrex's total_batch_size (dino_vitdet_base_4scale_12ep.py:48); OOM plan in plan.md
  num_workers: ${cluster.num_workers}
  flip_p: 0.5              # train only; detrex RandomFlip (common/data/coco_detr.py)

optim:                     # detrex common/optim.py AdamW, set in dino_vitdet_base_4scale_12ep.py:37-40
  lr: 1.0e-4
  betas: [0.9, 0.999]
  weight_decay: 1.0e-4     # 0 on torch LayerNorm/GroupNorm (weight_decay_norm=0.0, common/optim.py:10)
  backbone_lr_factor: 1.0  # E1
  lr_drop_epoch: 40        # lr x0.1 from epoch 40: coco_schedule.py:80 default_coco_scheduler(50, 40, 0)

trainer:
  max_epochs: 50           # dino_vitdet_base_4scale_50ep.py:10 (lr_multiplier_50ep)
  precision: 16-mixed      # E2; read from here, never from cluster.precision
  accumulate_grad_batches: 1
  gradient_clip_val: 0.1   # L2, dino_vitdet_base_4scale_12ep.py:28-30
  check_val_every_n_epoch: 5   # E6: epochs 5, 10, ..., 50
  log_every_n_steps: 50

encoder:
  attention: sdpa          # merged into the shared encoder group (default plain); user decision, plan.md

overfit:                   # FR8 overfit mode: train and validate on the first n_frames non-empty train frames
  enabled: false
  n_frames: 256
  max_steps: 3000
  eval_every: 500
  ap50_bar: 0.8
  classes: [person, car]
