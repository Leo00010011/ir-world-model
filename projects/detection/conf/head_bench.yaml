defaults:
  - irwm_base
  - _self_

hydra:
  searchpath:
    - pkg://irwm.conf

project: detection

# DINO-DETR head train-step cost on the GPU (spec/2026-10-23-dino-detr-head-port, FR10).
msda: cuda                      # cuda = detrex's compiled op; pytorch = its grid_sample fallback
modes: [train, infer]           # infer = eval-mode forward under no_grad
grids: [[32, 40]]               # (H', W') tokens: native (R5); add [32, 64] for stretch/crop
batch_sizes: [1, 2, 4, 8]
precisions: [fp32, fp16]        # fp16 = CUDA autocast
warmup: 3
timed: 10
in_channels: ${detector.in_channels}
