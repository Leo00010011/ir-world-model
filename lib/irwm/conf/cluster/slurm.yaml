# @package _global_
# SLURM runs. Used both by `sbatch slurm/job.sbatch <script> cluster=slurm` (single job; the
# launcher settings below are then ignored) and by `<script> -m cluster=slurm ...` (submitit sweep).
# Keep the resource values in sync with the #SBATCH lines in slurm/job.sbatch.
defaults:
  - override /hydra/launcher: submitit_slurm

cluster:
  name: slurm
  accelerator: gpu
  devices: 1             # GPUs per node (= tasks per node for Lightning DDP)
  num_nodes: 1
  num_workers: 8
  precision: 32-true
  partition: TODO_PARTITION   # TODO: fill in for your cluster
  account: null               # TODO: set if your cluster requires --account
  qos: null                   # TODO: set if your cluster requires --qos
  gres: "gpu:1"               # TODO: e.g. gpu:a100:1
  cpus_per_task: 8
  mem_gb: 32
  timeout_min: 240
  # Same name across requeues (SLURM_JOB_ID is kept on requeue), so jobs resume from their ckpt dir.
  run_name: slurm-${oc.env:SLURM_JOB_ID,nojob}


hydra:
  launcher:
    partition: ${cluster.partition}
    account: ${cluster.account}
    qos: ${cluster.qos}
    gres: ${cluster.gres}
    cpus_per_task: ${cluster.cpus_per_task}
    mem_gb: ${cluster.mem_gb}
    timeout_min: ${cluster.timeout_min}
    nodes: ${cluster.num_nodes}
    tasks_per_node: ${cluster.devices}
    max_num_timeout: 3          # automatic requeues on timeout/preemption
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
