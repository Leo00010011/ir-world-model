# Frozen DINOv2-Reg ViT-B/14 + DINO-Foresight PCA encoder (irwm.features.encoder, F4).
# policy: stretch | crop | native (irwm.features.preprocess). Roadmap R5 decided 2026-10-25 (user):
# native = centre crop to 5:4, then resize to 448x560 (32x40 tokens; thermal 640x512 is never
# cropped). 2.1x faster encoding than stretch for a 0.5-1.9 % higher forecast ratio (F4 probe).
policy: native
precision: fp16           # fp16 = CUDA autocast as the reference 16-mixed; fp32 for diagnostics
hub_version: dinof_release  # DINOv2 hub code pinned in irwm.worldmodel.assets
