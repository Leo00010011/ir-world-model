[project]
name = "irwm"
version = "0.1.0"
description = "Shared library for the IR world-model project (data, features, detection, world model, eval)."
requires-python = ">=3.11,<3.12"
dependencies = [
    # Pinned to DINO-Foresight's tested versions; CPU/CUDA source chosen in the root pyproject.
    "torch==2.2.0",
    "torchvision==0.17.0",
    # torch 2.2 wheels are compiled against NumPy 1.x.
    "numpy>=1.26,<2",
    "lightning>=2.4,<2.6",
    "hydra-core==1.3.2",
    "hydra-submitit-launcher==1.2.0",
    "wandb>=0.17",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["irwm"]
