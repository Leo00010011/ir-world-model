[project]
name = "ir-world-model"
version = "0.1.0"
description = "Representation quality of latent world-model predictions under IR domain shift (DINO-Foresight on FLIR ADAS v2)."
requires-python = ">=3.11,<3.12"
dependencies = ["irwm", "irwm-smoke", "irwm-dinof-audit", "irwm-data-stats", "irwm-clip-index", "irwm-feature-extraction", "irwm-detection", "irwm-detector-kit"]

[dependency-groups]
dev = ["pytest>=8"]
notebook = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.8",
]

[tool.uv]
package = false
# Only the laptop (Windows) and the cluster (Linux x86_64). torch 2.2.0+cu121 has no wheels elsewhere.
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# detrex/detectron2 compile C++/CUDA ops against the env's torch (F7, spec/2026-10-23-dino-detr-head-port).
# Install in two phases: `uv sync --no-install-package detectron2 --no-install-package detrex`, then `uv sync`.
no-build-isolation-package = ["detectron2", "detrex"]

[tool.uv.workspace]
members = ["lib", "projects/*"]

[tool.uv.sources]
irwm = { workspace = true }
irwm-smoke = { workspace = true }
irwm-dinof-audit = { workspace = true }
irwm-data-stats = { workspace = true }
irwm-clip-index = { workspace = true }
irwm-feature-extraction = { workspace = true }
irwm-detection = { workspace = true }
irwm-detector-kit = { workspace = true }
# Pinned, unmodified submodule (F7); editable so the in-tree _C ops and projects/dino are used.
detectron2 = { path = "third_party/detrex/detectron2", editable = true }
detrex = { path = "third_party/detrex", editable = true }
torch = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
]

# Static metadata so `uv lock` never runs their setup.py (which imports torch; no build isolation).
# detectron2: version from detectron2/__init__.py:10, requires-dist from detectron2/setup.py:162-196.
[[tool.uv.dependency-metadata]]
name = "detectron2"
version = "0.6"
requires-dist = [
    "Pillow>=7.1",
    "matplotlib",
    "pycocotools>=2.0.2",
    "termcolor>=1.1",
    "yacs>=0.1.8",
    "tabulate",
    "cloudpickle",
    "tqdm>4.29.0",
    "tensorboard",
    "fvcore>=0.1.5,<0.1.6",
    "iopath>=0.1.7,<0.1.10",
    "dataclasses; python_version<'3.7'",
    "omegaconf>=2.1,<2.4",
    "hydra-core>=1.1",
    "black",
    "packaging",
]

# detrex: version from setup.py:34, requires-dist from third_party/detrex/requirements.txt,
# except opencv-python -> opencv-python-headless (same cv2; cluster nodes have no libGL.so.1).
[[tool.uv.dependency-metadata]]
name = "detrex"
version = "0.3.0"
requires-dist = [
    "cloudpickle",
    "hydra-core",
    "omegaconf",
    "pybind11",
    "flake8",
    "isort",
    "black",
    "autoflake",
    "timm",
    "pytest",
    "scipy",
    "psutil",
    "opencv-python-headless",
    "wandb",
    "submitit",
    "einops",
    "fairscale",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not data and not gpu'"
markers = [
    "data: needs the real dataset or downloaded weights; skipped by default (run with -m data)",
    "gpu: needs CUDA and detrex/detectron2 built with CUDA ops; skipped by default (run with -m gpu)",
]
