[project]
name = "ir-world-model"
version = "0.1.0"
description = "Representation quality of latent world-model predictions under IR domain shift (DINO-Foresight on FLIR ADAS v2)."
requires-python = ">=3.11,<3.12"
dependencies = ["irwm", "irwm-smoke"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
# Only the laptop (Windows) and the cluster (Linux x86_64). torch 2.2.0+cu121 has no wheels elsewhere.
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.workspace]
members = ["lib", "projects/*"]

[tool.uv.sources]
irwm = { workspace = true }
irwm-smoke = { workspace = true }
torch = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not data'"
markers = ["data: needs the real dataset or downloaded weights; skipped by default (run with -m data)"]
